<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Iron Log" />
  <meta name="theme-color" content="#E8873A" />
  <title>Iron Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="app">
  <header id="header">
    <button id="header-back" aria-label="Go back">‹</button>
    <h1>Iron Log</h1>
    <button id="header-action" aria-label="More options" class="hidden">⋯</button>
  </header>

  <main id="content" aria-live="polite">
    <div class="empty"><p>Loading…</p></div>
  </main>

  <nav id="nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="log" aria-label="Log">
      <span class="icon">✏️</span><span>Log</span>
    </button>
    <button class="nav-btn" data-tab="prs" aria-label="Personal Records">
      <span class="icon">🏆</span><span>PRs</span>
    </button>
    <button class="nav-btn" data-tab="planner" aria-label="Session Planner">
      <span class="icon">📋</span><span>Planner</span>
    </button>
    <button class="nav-btn" data-tab="settings" aria-label="Settings">
      <span class="icon">⚙️</span><span>Settings</span>
    </button>
  </nav>
</div>

<button id="fab" aria-label="Log a set">+</button>

<!-- Log set modal -->
<div class="modal-overlay" id="log-modal" role="dialog" aria-modal="true" aria-label="Log a set">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Log a set</div>

    <div class="form-row">
      <label for="modal-exercise">Exercise</label>
      <select id="modal-exercise" onchange="onLogExerciseChange(this.value)"></select>
    </div>

    <!-- Weight: any value, steppers sized to the current unit -->
    <div class="metric-block">
      <div class="metric-head">
        <span class="metric-label">Weight</span>
        <span class="metric-unit" id="modal-unit-lbl">lbs</span>
      </div>
      <div class="stepper">
        <button type="button" class="step-btn" id="step-w-down-coarse" onclick="stepWeight(-1,'coarse')" aria-label="Decrease weight">−10</button>
        <button type="button" class="step-btn" id="step-w-down-fine" onclick="stepWeight(-1,'fine')" aria-label="Decrease weight slightly">−2.5</button>
        <input type="number" id="modal-weight" class="step-value" inputmode="decimal" min="0" step="2.5" placeholder="0" oninput="refreshModalCalc()" />
        <button type="button" class="step-btn" id="step-w-up-fine" onclick="stepWeight(1,'fine')" aria-label="Increase weight slightly">+2.5</button>
        <button type="button" class="step-btn" id="step-w-up-coarse" onclick="stepWeight(1,'coarse')" aria-label="Increase weight">+10</button>
      </div>
      <div class="plate-chips" id="modal-plates"></div>
    </div>

    <!-- Reps: any count, plus quick picks -->
    <div class="metric-block">
      <div class="metric-head"><span class="metric-label">Reps</span></div>
      <div class="stepper">
        <button type="button" class="step-btn" onclick="stepReps(-1)" aria-label="Decrease reps">−1</button>
        <input type="number" id="modal-reps" class="step-value" inputmode="numeric" min="1" max="99" placeholder="5" oninput="refreshModalCalc()" />
        <button type="button" class="step-btn" onclick="stepReps(1)" aria-label="Increase reps">+1</button>
      </div>
      <div class="chips-row" id="reps-chips"></div>
    </div>

    <div class="form-row">
      <label for="modal-notes">Notes</label>
      <input type="text" id="modal-notes" placeholder="Optional" />
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-full" onclick="closeLogModal()">Cancel</button>
      <button class="btn btn-primary btn-full" onclick="submitLog()">Save set</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('log-modal').addEventListener('click', function(e) {
    if (e.target === this) closeLogModal();
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
