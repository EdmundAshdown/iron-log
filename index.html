<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Iron Log" />
  <meta name="theme-color" content="#1D9E75" />
  <title>Iron Log</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="app">

  <!-- Header -->
  <header id="header">
    <button id="header-back" aria-label="Go back">‹</button>
    <h1>Iron Log</h1>
    <button id="header-action" aria-label="More options" class="hidden">⋯</button>
  </header>

  <!-- Main content -->
  <main id="content" aria-live="polite">
    <div class="empty"><p>Loading…</p></div>
  </main>

  <!-- Bottom nav -->
  <nav id="nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="log" aria-label="Log">
      <span class="icon">✏️</span>
      <span>Log</span>
    </button>
    <button class="nav-btn" data-tab="prs" aria-label="Personal Records">
      <span class="icon">🏆</span>
      <span>PRs</span>
    </button>
    <button class="nav-btn" data-tab="planner" aria-label="Session Planner">
      <span class="icon">📋</span>
      <span>Planner</span>
    </button>
    <button class="nav-btn" data-tab="settings" aria-label="Settings">
      <span class="icon">⚙️</span>
      <span>Settings</span>
    </button>
  </nav>

</div>

<!-- FAB -->
<button id="fab" aria-label="Log a set">+</button>

<!-- Log set modal (bottom sheet) -->
<div class="modal-overlay" id="log-modal" role="dialog" aria-modal="true" aria-label="Log a set">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Log a set</div>

    <div class="form-row">
      <label for="modal-exercise">Exercise</label>
      <select id="modal-exercise"></select>
    </div>

    <div class="form-row">
      <label for="modal-weight">Weight</label>
      <input type="number" id="modal-weight" placeholder="135" min="0" step="2.5" inputmode="decimal" />
    </div>

    <div class="form-row">
      <label for="modal-reps">Reps</label>
      <select id="modal-reps">
        <option value="1">1 rep (1RM)</option>
        <option value="2">2 reps</option>
        <option value="3">3 reps (3RM)</option>
        <option value="4">4 reps</option>
        <option value="5" selected>5 reps (5RM)</option>
        <option value="6">6 reps</option>
        <option value="7">7 reps</option>
        <option value="8">8 reps</option>
        <option value="10">10 reps</option>
        <option value="12">12 reps</option>
        <option value="15">15 reps</option>
        <option value="20">20 reps</option>
      </select>
    </div>

    <div class="form-row">
      <label for="modal-notes">Notes</label>
      <input type="text" id="modal-notes" placeholder="Optional" />
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-full" onclick="closeLogModal()">Cancel</button>
      <button class="btn btn-primary btn-full" onclick="submitLog()">Save set</button>
    </div>
  </div>
</div>

<!-- Tap outside modal to close -->
<script>
  document.getElementById('log-modal').addEventListener('click', function(e) {
    if (e.target === this) closeLogModal();
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

<script type="module" src="js/app.js"></script>

</body>
</html>
